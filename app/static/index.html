<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="nav-brand">Notifications</div>
        <div class="nav-right">
            <span class="nav-meta" id="lastUpdated"></span>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </nav>

    <main>
        <div class="grid">
            <div class="card stats-card">
                <div class="stat">
                    <span class="stat-value" id="totalNotifications">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="uniqueApps">0</span>
                    <span class="stat-label">Apps</span>
                </div>
            </div>

            <div class="card chart-card">
                <div class="card-header">Distribution</div>
                <div id="appChart" class="chart"></div>
            </div>
        </div>

        <div class="card form-card">
            <div class="card-header">New Entry</div>
            <div class="toast success" id="successMessage">Added</div>
            <div class="toast error" id="errorMessage">Failed</div>
            <form id="addForm">
                <div class="form-grid">
                    <input type="text" id="appName" placeholder="App" required>
                    <input type="text" id="title" placeholder="Title" required>
                    <textarea id="text" placeholder="Message" required></textarea>
                    <button type="submit">Add</button>
                </div>
            </form>
        </div>

        <div class="card table-card">
            <div class="card-header">
                <span>History</span>
                <div class="controls">
                    <select id="filterApp">
                        <option value="">All</option>
                    </select>
                    <select id="limitSelect">
                        <option value="50">50</option>
                        <option value="100" selected>100</option>
                        <option value="200">200</option>
                    </select>
                    <button type="button" class="btn-secondary" onclick="refresh()">Refresh</button>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>App</th>
                            <th>Title</th>
                            <th>Message</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="notificationsTable"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
