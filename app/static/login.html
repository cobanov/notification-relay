<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="nav-brand">Notifications</div>
        <div class="nav-meta">Login</div>
    </nav>

    <main>
        <div class="auth-wrap">
            <div class="card auth-card">
                <div class="card-header">Dashboard Login</div>
                <div class="toast error" id="loginError">Invalid password</div>
                <form id="loginForm">
                    <div class="auth-grid">
                        <input type="password" id="password" placeholder="API key" autocomplete="current-password" required>
                        <button type="submit">Login</button>
                    </div>
                </form>
                <div class="auth-hint">Password is the same as your <code>X-API-Key</code>.</div>
            </div>
        </div>
    </main>

    <script src="/static/login.js"></script>
</body>
</html>
