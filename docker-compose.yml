services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-4142}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      API_KEY: ${API_KEY:-your-secret-api-key-change-this}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      TZ: UTC
    ports:
      - "${API_PORT:-4141}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: postgres:15-alpine
    environment:
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-notifications}
      PGHOST: db
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Backup service started"
        while true; do
          FILENAME="/backups/backup_$$(date +%Y%m%d_%H%M%S).sql"
          pg_dump > "$$FILENAME"
          echo "Backup saved: $$FILENAME"
          find /backups -name "*.sql" -mtime +7 -delete
          sleep 86400
        done
    restart: unless-stopped

volumes:
  postgres_data:

