<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Notifications</h1>
            <span class="updated" id="lastUpdated"></span>
        </header>

        <section class="stats">
            <div class="stat">
                <span class="stat-value" id="totalNotifications">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="uniqueApps">0</span>
                <span class="stat-label">Apps</span>
            </div>
        </section>

        <section class="panel">
            <h2>By App</h2>
            <div id="appChart" class="chart"></div>
        </section>

        <section class="panel">
            <h2>Add Notification</h2>
            <div class="message success" id="successMessage">Added successfully</div>
            <div class="message error" id="errorMessage">Failed to add</div>
            <form id="addForm">
                <div class="form-row">
                    <input type="text" id="appName" placeholder="App Name" required>
                    <input type="text" id="title" placeholder="Title" required>
                </div>
                <textarea id="text" placeholder="Message" required></textarea>
                <button type="submit">Add</button>
            </form>
        </section>

        <section class="panel">
            <div class="toolbar">
                <h2>Recent</h2>
                <div class="filters">
                    <select id="filterApp">
                        <option value="">All Apps</option>
                    </select>
                    <select id="limitSelect">
                        <option value="50">50</option>
                        <option value="100" selected>100</option>
                        <option value="200">200</option>
                    </select>
                    <button type="button" onclick="refresh()">Refresh</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>App</th>
                        <th>Title</th>
                        <th>Message</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="notificationsTable"></tbody>
            </table>
        </section>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
